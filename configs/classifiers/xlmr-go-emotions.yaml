# Multi-label emotion classifier (28 labels, several per text) on a multilingual encoder:
#
#   data -> finetune x {3 learning rates} -> best -> calibration -> test -> export
#
# The short multi-label pipeline. Plain BCE, then calibration: a temperature and a decision
# threshold per label, which matters more than the temperature here. Rare labels share one
# threshold, because a cut fitted on a handful of positives is noise.
#
# For a multilingual task, jhu-clsp/mmBERT-base is the first alternative to try as `base_model`:
# it beats XLM-R-base on XTREME in its authors' comparison. It was not compared with XLM-R-large.
track: classifiers
name: xlmr-go-emotions
seed: 42

vars:
  base_model: FacebookAI/xlm-roberta-base
  dataset: google-research-datasets/go_emotions

stages:
  - name: data
    kind: classifiers.prepare_data
    params:
      problem_type: multi_label
      # the `labels` column is a list of class ids; their names come from the dataset's features
      train: {path: "${vars.dataset}", name: simplified, split: train}
      eval: {path: "${vars.dataset}", name: simplified, split: validation}
      test: {path: "${vars.dataset}", name: simplified, split: test}
      calibration_fraction: 0.1       # out of train: thresholds are not fitted on the split that picks the checkpoint
    gate: {metric: n_labels, min: 2}

  - name: finetune
    kind: classifiers.finetune
    matrix:
      train.learning_rate: [1.0e-5, 2.0e-5, 3.0e-5]   # the range XLM-R is tuned in; ModernBERT's is higher
    params:
      init_from: ${vars.base_model}
      labels: ${data.labels}
      train_data: ${data.train}
      eval_data: ${data.eval}
      early_stopping_patience: 3
      train:
        num_train_epochs: 5
        per_device_train_batch_size: 32
        per_device_eval_batch_size: 128
        warmup: 0.06
        eval_steps: 300
        group_by_length: true
        metric_for_best_model: eval_micro_f1    # at threshold 0.5, before calibration
        greater_is_better: true

  - name: best
    kind: classifiers.select
    params: {group: finetune, metric: eval/micro_f1}
    gate: {metric: eval/micro_f1, min: 0.3}     # a sanity floor

  - name: calibration
    kind: classifiers.calibrate
    params:
      model: ${best.model}
      data: ${data.calibration}
      fit_thresholds: true
      min_positives: 20               # labels with fewer positives in the split share one threshold

  - name: test
    kind: classifiers.eval
    params:
      model: ${best.model}
      calibration: ${calibration.calibration}
      data: ${data.test}
    gate:   # floors to adjust once you have a first run; they are not measured results
      - {metric: eval/micro_f1, min: 0.45}
      - {metric: eval/macro_f1, min: 0.35}

  - name: export
    kind: classifiers.export
    needs: [test]
    params:
      model: ${best.model}
      calibration: ${calibration.calibration}
