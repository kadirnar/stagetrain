# Single-label topic classifier, every stage kind of the track:
#
#   data -> adapt -> teacher -> teacher_calibration -> pseudo -> student -> calibration -> test -> export
#
# AG News stands in for "a small labelled set plus a large unlabeled pool": 20k labelled rows, and
# the other 100k training texts used without their labels. For your own task, point `train` at
# the labelled data and `unlabeled` at raw in-domain text.
#
# The gate thresholds are starting points, not measured results: set them from your first run.
#
#   stagetrain plan configs/classifiers/modernbert-agnews.yaml
#   stagetrain run  configs/classifiers/modernbert-agnews.yaml
track: classifiers
name: modernbert-agnews
seed: 42

vars:
  base_model: answerdotai/ModernBERT-base
  dataset: fancyzhx/ag_news
  max_length: 256

defaults:
  classifiers.finetune:
    max_length: ${vars.max_length}
    llrd: 0.9                 # each layer below the top trains 10% slower
    head_lr_multiplier: 5     # the new head learns faster than the pretrained encoder
    head_warmup_epochs: 0.5   # LP-FT: head only first, so its random init does not disturb the encoder
    label_smoothing: 0.05
    train:
      learning_rate: 3.0e-5
      num_train_epochs: 3
      per_device_train_batch_size: 32
      per_device_eval_batch_size: 128
      warmup: 0.06
      group_by_length: true
      load_best_model_at_end: true
      metric_for_best_model: eval_macro_f1
      greater_is_better: true
  classifiers.calibrate: {max_length: "${vars.max_length}", batch_size: 128}
  classifiers.eval: {max_length: "${vars.max_length}", batch_size: 128}

stages:
  - name: data
    kind: classifiers.prepare_data
    params:
      train: {path: "${vars.dataset}", split: "train[:20000]"}
      test: {path: "${vars.dataset}", split: test}
      unlabeled: {path: "${vars.dataset}", split: "train[20000:]"}
      eval_fraction: 0.1      # stratified, taken out of train; used for model selection and calibration
    gate:
      - {metric: n_labels, min: 2}
      - {metric: min_class_count, min: 50}

  # Stage 1: adapt the encoder to the domain's text before it sees a label.
  - name: adapt
    kind: classifiers.mlm_adapt
    params:
      init_from: ${vars.base_model}
      data: ["${data.train}", "${data.unlabeled}"]
      max_length: ${vars.max_length}
      mlm_probability: 0.3    # what ModernBERT was pretrained with
      train:
        learning_rate: 5.0e-5
        num_train_epochs: 1
        per_device_train_batch_size: 32
        warmup: 0.06
        group_by_length: true
    gate: {metric: mlm/loss_drop, min: 0.0}   # adaptation must not make the masked-LM worse

  # Stage 2: the teacher, trained on gold labels only.
  - name: teacher
    kind: classifiers.finetune
    params:
      init_from: ${adapt.model}
      labels: ${data.labels}
      train_data: ${data.train}
      eval_data: ${data.eval}
    gate: {metric: eval/macro_f1, min: 0.85}

  - name: teacher_calibration
    kind: classifiers.calibrate
    params: {model: "${teacher.model}", data: "${data.eval}"}

  # Stage 3: the teacher labels the pool; only confident, calibrated predictions are kept.
  - name: pseudo
    kind: classifiers.pseudo_label
    params:
      model: ${teacher.model}
      calibration: ${teacher_calibration.calibration}
      data: ${data.unlabeled}
      max_length: ${vars.max_length}
      batch_size: 128
      min_confidence: 0.95
      max_per_class: 10000    # keeps the pseudo-labelled set balanced
    gate:
      - {metric: pseudo/kept, min: 1000}
      - {metric: pseudo/classes_covered, min: 4}

  # Stage 4: the student restarts from the adapted encoder on gold + soft pseudo labels.
  - name: student
    kind: classifiers.finetune
    params:
      init_from: ${adapt.model}
      labels: ${data.labels}
      train_data: ${data.train}
      eval_data: ${data.eval}
      extra_train_data:
        - {path: "${pseudo.data}", weight: 0.5}
    gate:   # self-training must not cost accuracy on gold data
      - {metric: eval/macro_f1, baseline: teacher.eval/macro_f1, max_drop: 0.005}

  # Stage 5: post-hoc calibration; the weights are final from here on.
  - name: calibration
    kind: classifiers.calibrate
    params: {model: "${student.model}", data: "${data.eval}"}
    gate: {metric: calibration/ece_after, max: 0.05}

  - name: test
    kind: classifiers.eval
    params:
      model: ${student.model}
      calibration: ${calibration.calibration}
      data: ${data.test}
      save_predictions: true
    gate:
      - {metric: eval/macro_f1, min: 0.88}
      - {metric: eval/ece, max: 0.05}

  - name: export
    kind: classifiers.export
    needs: [test]             # only a model that passed the test gate is exported
    params:
      model: ${student.model}
      calibration: ${calibration.calibration}
      max_length: ${vars.max_length}
      onnx: true              # skipped with a note unless `onnx` is installed
