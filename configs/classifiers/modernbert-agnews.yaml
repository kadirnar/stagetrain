# The accuracy recipe for a single-label encoder classifier. Every stage is here because the
# evidence in docs/research/classifiers.md says it pays for itself.
#
#   data ─┬─> baseline (TF-IDF + logistic regression: the bar)
#         ├─> adapt (masked-LM on in-domain text)
#         └─> finetune x18 = {plain, adapted encoder} x {3 learning rates} x {3 seeds}
#                  └─> best (by the mean over seeds) ──> calibration ──> test (paired against the baseline) ──> export
#
#   stagetrain plan   configs/classifiers/modernbert-agnews.yaml
#   stagetrain run    configs/classifiers/modernbert-agnews.yaml
#   stagetrain report configs/classifiers/modernbert-agnews.yaml --open
#
# AG News stands in for "a small labelled set plus a large unlabeled pool": 20k labelled rows, and
# the other 100k training texts used without their labels. For your own task, point `train` at the
# labelled data and `unlabeled` at raw in-domain text. The gate thresholds are starting points,
# not measured results.
track: classifiers
name: modernbert-agnews
seed: 42

vars:
  # To compare encoders, add them to the matrix's `init_from` list. In the controlled comparisons
  # found, DeBERTa-v3 is at least as accurate as ModernBERT on English text up to 512 tokens, at
  # two to three times the compute; a large model is worth about two points over its base sibling.
  base_model: answerdotai/ModernBERT-base
  dataset: fancyzhx/ag_news

defaults:
  classifiers.finetune:
    labels: ${data.labels}
    train_data: ${data.train}
    eval_data: ${data.eval}
    # max_length is left at `auto`: the length that fits 99 % of the training rows.
    early_stopping_patience: 3        # evaluations without improvement; the best checkpoint is kept
    train:
      num_train_epochs: 5             # an upper bound: early stopping decides
      per_device_train_batch_size: 32
      per_device_eval_batch_size: 128
      warmup: 0.06
      eval_steps: 125                 # about four evaluations per epoch on 16k rows
      group_by_length: true
      # precision: bf16               # on a GPU; fp16 has produced NaN losses with ModernBERT

stages:
  # 1. Four splits. `eval` picks checkpoints and settings, `calibration` fits the temperature,
  #    `test` is only ever reported.
  - name: data
    kind: classifiers.prepare_data
    params:
      train: {path: "${vars.dataset}", split: "train[:20000]"}
      test: {path: "${vars.dataset}", split: test}
      unlabeled: {path: "${vars.dataset}", split: "train[20000:]"}
      eval_fraction: 0.1
      calibration_fraction: 0.1
    gate:
      - {metric: n_labels, min: 2}
      - {metric: min_class_count, min: 50}

  # 2. The bar: minutes on a CPU. If a fine-tuned encoder does not clearly beat this, the
  #    problem is the data or the labels, not the hyperparameters.
  - name: baseline
    kind: classifiers.baseline
    params:
      labels: ${data.labels}
      train_data: ${data.train}
      data: ${data.test}

  # 3. Masked-LM on the task's own text. It helps most when the domain is far from web and news
  #    text, which AG News is not, so it has to earn its place: stage 4 trains with and without it.
  - name: adapt
    kind: classifiers.mlm_adapt
    params:
      init_from: ${vars.base_model}
      data: ["${data.train}", "${data.unlabeled}"]
      max_length: 128
      mlm_probability: 0.15           # lower masking suits classification; 0.3 is the pretraining rate
      train:
        learning_rate: 5.0e-5
        num_train_epochs: 1
        per_device_train_batch_size: 32
        warmup: 0.06
        group_by_length: true

  # 4. The settings that matter, swept: the encoder (plain or adapted) and the learning rate, three
  #    seeds each. 5e-5 and 8e-5 are what ModernBERT's authors selected for the base model.
  - name: finetune
    kind: classifiers.finetune
    matrix:
      init_from: ["${vars.base_model}", "${adapt.model}"]
      train.learning_rate: [3.0e-5, 5.0e-5, 8.0e-5]
      seed: [1, 2, 3]

  # 5. A setting is judged by its mean over seeds, and its most typical run is handed on: the
  #    best single run would reward a lucky seed. `select/std` is the size of seed noise.
  - name: best
    kind: classifiers.select
    params: {group: finetune, metric: eval/macro_f1, average_over: [seed]}
    gate: {metric: select/mean, min: 0.85}

  # 6. The temperature is fitted on rows that picked neither the checkpoint nor the setting.
  - name: calibration
    kind: classifiers.calibrate
    params: {model: "${best.model}", data: "${data.calibration}", batch_size: 128}
    gate:
      - {metric: calibration/at_bound, max: 0}
      - {metric: calibration/ece_after, max: 0.05}

  # 7. The reported number, with its interval, and the difference to the baseline row by row.
  - name: test
    kind: classifiers.eval
    params:
      model: ${best.model}
      calibration: ${calibration.calibration}
      data: ${data.test}
      batch_size: 128
      compare_to: ${baseline.predictions}
    gate:
      - {metric: eval/delta_macro_f1_ci_low, min: 0.0}   # better than the baseline, beyond chance
      - {metric: eval/ece, max: 0.05}

  - name: export
    kind: classifiers.export
    needs: [test]                     # only a model that passed the test gate is exported
    params:
      model: ${best.model}
      calibration: ${calibration.calibration}
      onnx: true                      # skipped with a note unless `onnx` and `onnxscript` are installed
