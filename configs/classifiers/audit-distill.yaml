# Two things to do once the recipe of modernbert-agnews.yaml has given a learning rate:
#
#   1. Audit the labels. Five runs each hold a fifth of the training rows out; every row is then
#      predicted by a model that never saw it, and the rows it is surest are wrong come first.
#   2. Distil a seed ensemble. Three seeds of the tuned setting label the unlabeled pool with the
#      mean of their distributions, and one student is trained on gold plus those soft labels.
#
#   data ─┬─> cv x5 (one fold held out each) ──> audit (suspects.jsonl to relabel by hand)
#         └─> teacher x3 seeds ──> pick ──> teacher_test
#                   └──> distill (ensemble soft labels) ──> student ──> calibration ──> test ──> export
#
#   stagetrain plan configs/classifiers/audit-distill.yaml
#   stagetrain run  configs/classifiers/audit-distill.yaml --until audit     # the audit alone
#
# Same-architecture self-training at a confidence threshold is not what this does: that adds the
# rows a model already gets right. An ensemble's averaged distribution carries what the seeds
# disagree about. The gate thresholds are starting points, not measured results.
track: classifiers
name: modernbert-agnews-distill
seed: 42

vars:
  base_model: answerdotai/ModernBERT-base
  dataset: fancyzhx/ag_news
  learning_rate: 5.0e-5               # the winning setting of the sweep in modernbert-agnews.yaml

defaults:
  classifiers.finetune:
    init_from: ${vars.base_model}
    labels: ${data.labels}
    train_data: ${data.train}
    eval_data: ${data.eval}
    early_stopping_patience: 3
    label_smoothing: 0.0              # a teacher whose confidence is distilled is trained without smoothing
    train:
      learning_rate: ${vars.learning_rate}
      num_train_epochs: 5
      per_device_train_batch_size: 32
      per_device_eval_batch_size: 128
      warmup: 0.06
      eval_steps: 125
      group_by_length: true

stages:
  - name: data
    kind: classifiers.prepare_data
    params:
      train: {path: "${vars.dataset}", split: "train[:20000]"}
      test: {path: "${vars.dataset}", split: test}
      unlabeled: {path: "${vars.dataset}", split: "train[20000:]"}
      eval_fraction: 0.1
      calibration_fraction: 0.1

  # 1. Cross-validation: five runs, each trained without one fold and asked to predict it.
  - name: cv
    kind: classifiers.finetune
    matrix: {fold: [0, 1, 2, 3, 4]}
    params: {folds: 5}

  # The top 2 % by out-of-fold loss go to suspects.jsonl. Nothing is deleted (drop_fraction: 0):
  # relabel the suspects by hand and rerun. audit/oof_macro_f1 is the recipe's quality on all of
  # the training rows, each scored by a model that did not train on it.
  - name: audit
    kind: classifiers.audit_labels
    params:
      group: cv
      labels: ${data.labels}
      train_data: ${data.train}
      review_fraction: 0.02

  # 2. The teacher: three seeds of one setting.
  - name: teacher
    kind: classifiers.finetune
    matrix: {seed: [1, 2, 3]}

  - name: pick
    kind: classifiers.select
    params: {group: teacher, metric: eval/macro_f1, average_over: [seed]}

  - name: teacher_test
    kind: classifiers.eval
    params: {model: "${pick.model}", data: "${data.test}", batch_size: 128}

  # Every pool row is kept with the ensemble's mean distribution: no confidence threshold.
  - name: distill
    kind: classifiers.pseudo_label
    params:
      group: teacher
      ensemble: winner
      model: ${pick.model}
      data: ${data.unlabeled}
      max_samples: 50000
      keep_all: true
      batch_size: 128

  # The student starts from the plain encoder, not from a teacher, and sees gold rows at full
  # weight and soft rows at half.
  - name: student
    kind: classifiers.finetune
    params:
      extra_train_data:
        - {path: "${distill.data}", weight: 0.5}

  - name: calibration
    kind: classifiers.calibrate
    params: {model: "${student.model}", data: "${data.calibration}", batch_size: 128}

  # One model in place of three: it must not be worse than a single teacher beyond chance.
  - name: test
    kind: classifiers.eval
    params:
      model: ${student.model}
      calibration: ${calibration.calibration}
      data: ${data.test}
      batch_size: 128
      compare_to: ${teacher_test.predictions}
    gate: {metric: eval/delta_macro_f1_ci_high, min: 0.0}

  - name: export
    kind: classifiers.export
    needs: [test]
    params:
      model: ${student.model}
      calibration: ${calibration.calibration}
