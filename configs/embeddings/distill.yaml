# Embedding track, shorter recipe: adapt an existing embedding model to a domain with a
# cross-encoder teacher. There is no pre-training stage; the published model mines its own negatives.
#
#   data ─► mine (teacher rescoring, scores kept) ─► finetune (InfoNCE + margin distillation) ─► eval ─► export
#
#   stagetrain run configs/embeddings/distill.yaml --set vars.pairs=/data/my_pairs.jsonl

track: embeddings
name: e5-small-distill
seed: 42

vars:
  base_model: intfloat/multilingual-e5-small
  teacher: BAAI/bge-reranker-v2-m3
  pairs: sentence-transformers/natural-questions   # or a local .jsonl / .parquet with query, positive columns
  prompts: {query: "query: ", document: "passage: "}

stages:
  - name: data
    kind: embeddings.prepare_data
    params:
      sources:
        - path: ${vars.pairs}
          columns: {query: query, positive: answer}
      eval_fraction: 0.05
      max_eval_queries: 1000

  - name: baseline
    kind: embeddings.eval          # the published model, before any training: the number to beat
    params:
      model: ${vars.base_model}
      eval_set: ${data.eval_set}
      encoder: {prompts: "${vars.prompts}", max_seq_length: 512}

  - name: mine
    kind: embeddings.mine_negatives
    params:
      model: ${vars.base_model}
      train_data: ${data.train}
      corpus: ${data.corpus}
      cross_encoder: ${vars.teacher}   # rescoring: the filters and the written scores are the teacher's
      output_scores: true
      num_negatives: 4
      range_min: 0
      range_max: 50
      relative_margin: null
      absolute_margin: 1.0             # teacher logits: keep negatives at least 1.0 below the positive
      encoder: {prompts: "${vars.prompts}", max_seq_length: 512}

  - name: finetune
    kind: embeddings.finetune
    params:
      init_from: ${vars.base_model}
      train_data: ${mine.train}
      eval_set: ${data.eval_set}
      encoder: {prompts: "${vars.prompts}", max_seq_length: 512}
      loss:
        name: mnrl
        distill_weight: 0.05           # + 0.05 x MarginMSE on the teacher's score margins
        distill_similarity: cosine     # e5 ends in Normalize: match 20 x cosine to the teacher's logits
        distill_scale: 20
      train:
        learning_rate: 1.0e-5
        num_train_epochs: 1
        per_device_train_batch_size: 32
        warmup: 0.1
        eval_steps: 500
    gate: {metric: eval/ndcg@10, baseline: baseline.eval/ndcg@10, max_drop: 0.0}

  - name: eval
    kind: embeddings.eval
    params:
      model: ${finetune.model}
      eval_set: ${data.eval_set}
    gate: {metric: eval/ndcg@10, baseline: baseline.eval/ndcg@10, max_drop: 0.0}

  - name: export
    kind: embeddings.export
    needs: [eval]
    params:
      model: ${finetune.model}
