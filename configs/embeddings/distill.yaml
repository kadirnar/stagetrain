# The shortest useful recipe: one small multilingual embedder, one teacher, one training run.
#
#   data ─> untuned ─> mine (teacher rescoring, scores kept) ─> finetune (listwise distillation) ─> test ─> export
#
# The model mines its own negatives here, which keeps the recipe to two models. A stronger miner
# finds better ones: set `vars.miner` to a larger embedder (as configs/embeddings/retrieval.yaml does).
#
#   stagetrain run configs/embeddings/distill.yaml --set vars.pairs=/data/my_pairs.jsonl

track: embeddings
name: e5-small-distill
seed: 42

vars:
  base_model: intfloat/multilingual-e5-small
  miner: intfloat/multilingual-e5-small
  teacher: BAAI/bge-reranker-v2-m3
  pairs: sentence-transformers/natural-questions   # or a local .jsonl / .parquet with query, positive columns
  encoder: &encoder
    max_seq_length: 512
    prompts: {query: "query: ", document: "passage: "}   # the prefixes e5 was trained with

stages:
  - name: data
    kind: embeddings.prepare_data
    params:
      sources:
        - path: ${vars.pairs}
          columns: {query: query, positive: answer}
          max_samples: 30000
      eval_fraction: 0.03
      test_fraction: 0.05
      max_eval_queries: 1000

  - name: untuned
    kind: embeddings.eval          # the published model, before any training: the number to beat
    params:
      model: ${vars.base_model}
      eval_set: ${data.test_set}
      encoder: *encoder

  - name: mine
    kind: embeddings.mine_negatives
    params:
      model: ${vars.miner}
      train_data: ${data.train}
      corpus: ${data.corpus}
      cross_encoder: ${vars.teacher}   # rescoring: the filter and the written scores are the teacher's
      teacher_scores: probability      # sigmoid outputs in (0, 1), so the margin below is relative
      relative_margin: 0.05            # keep candidates the teacher scores under 95 % of the positive
      range_max: 40
      num_negatives: 7
      output_scores: true
      encoder: *encoder
    gate: {metric: mine/kept_fraction, min: 0.5}

  - name: finetune
    kind: embeddings.finetune
    params:
      init_from: ${vars.base_model}
      train_data: ${mine.train}
      eval_set: ${data.eval_set}
      encoder: *encoder
      loss:
        name: mnrl
        distill_weight: 1.0            # listwise KL on the teacher's ranking of [positive, 7 negatives]
        contrastive_weight: 0.1        # + 0.1 x InfoNCE
      train:
        learning_rate: 1.0e-5
        num_train_epochs: 1
        per_device_train_batch_size: 32
        warmup: 0.1
        eval_steps: 500
        load_best_model_at_end: true
        metric_for_best_model: eval_ir_cosine_ndcg@10
        greater_is_better: true

  - name: test
    kind: embeddings.eval
    params:
      model: ${finetune.model}
      eval_set: ${data.test_set}
      compare_to: ${untuned.scores}
    gate: {metric: eval/delta_ci_low, min: 0.0}   # better than the untuned model, beyond chance

  - name: export
    kind: embeddings.export
    needs: [test]
    params:
      model: ${finetune.model}
