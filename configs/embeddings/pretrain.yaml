# Pre-training a plain encoder into an embedding model: the long road, for the cases where no
# published embedder fits.
#
#   data_weak ─> pretrain ─┬─> mine ─> finetune ─> test ─> export
#   data_sup ──────────────┘
#
# When this is worth it: a language or domain no public embedding model covers, or a deployment
# that may not use them, AND tens of millions of weak pairs AND contrastive batches in the
# thousands. The measured gains of this stage come from 10^8+ pairs at batch sizes of 16k-32k; at
# the size below (1M pairs, batch 512) nothing shows it beating a published embedder, which is
# why configs/embeddings/retrieval.yaml does not do it. Raise `weak_pairs` and the batch size as
# far as the hardware allows.
#
#   stagetrain plan configs/embeddings/pretrain.yaml
#   stagetrain run  configs/embeddings/pretrain.yaml --set vars.base_model=<encoder>

track: embeddings
name: modernbert-pretrain
seed: 42

vars:
  base_model: answerdotai/ModernBERT-base
  max_seq_length: 512
  weak_pairs: 1000000

stages:
  - name: data_weak
    kind: embeddings.prepare_data
    params:
      sources:
        - path: sentence-transformers/gooaq
          columns: {query: question, positive: answer}
          shuffle: true
          max_samples: ${vars.weak_pairs}
      min_chars: 8
      max_chars: 4000
    gate: {metric: data/train_pairs, min: 100000}

  - name: data_sup
    kind: embeddings.prepare_data
    params:
      sources:
        - path: sentence-transformers/natural-questions
          columns: {query: query, positive: answer}
      eval_fraction: 0.02
      test_fraction: 0.03
      max_eval_queries: 2000
      min_chars: 8
      max_chars: 4000

  - name: bm25
    kind: embeddings.bm25
    params: {eval_set: "${data_sup.test_set}"}

  # In-batch negatives only; the contrastive batch of 512 is encoded 64 texts at a time.
  - name: pretrain
    kind: embeddings.pretrain
    params:
      init_from: ${vars.base_model}
      train_data: ${data_weak.train}
      eval_set: ${data_sup.eval_set}
      encoder: {pooling: mean, max_seq_length: "${vars.max_seq_length}"}
      loss: {name: cached_mnrl, mini_batch_size: 64}
      batch_sampler: no_duplicates_hashed
      train:
        learning_rate: 1.0e-4            # a plain encoder needs about ten times the fine-tuning rate
        num_train_epochs: 1              # more pre-training steps were not better in the published runs
        per_device_train_batch_size: 512
        warmup: 0.05
        logging_steps: 50
        eval_steps: 500
        save_total_limit: 2
    gate: {metric: eval/ndcg@10, min: 0.2}   # a floor: stop here if pre-training learned nothing

  # Self-mining, because here the pre-trained model is the only embedder for this domain. Where a
  # stronger one exists, point `model` at it.
  - name: mine
    kind: embeddings.mine_negatives
    params:
      model: ${pretrain.model}
      train_data: ${data_sup.train}
      corpus: ${data_sup.corpus}
      num_negatives: 7
      relative_margin: 0.05
      batch_size: 256
    gate: {metric: mine/kept_fraction, min: 0.5}

  - name: finetune
    kind: embeddings.finetune
    params:
      init_from: ${pretrain.model}
      train_data: ${mine.train}
      eval_set: ${data_sup.eval_set}
      loss: {name: mnrl}
      train:
        learning_rate: 2.0e-5
        num_train_epochs: 1
        per_device_train_batch_size: 64
        warmup: 0.05
        eval_steps: 250
        save_total_limit: 2
        load_best_model_at_end: true
        metric_for_best_model: eval_ir_cosine_ndcg@10
        greater_is_better: true

  - name: test
    kind: embeddings.eval
    params:
      model: ${finetune.model}
      eval_set: ${data_sup.test_set}
      compare_to: ${bm25.scores}
    gate: {metric: eval/delta_ci_low, min: 0.0}   # a dense model that does not beat BM25 is not worth serving

  - name: export
    kind: embeddings.export
    needs: [test]
    params:
      model: ${finetune.model}
      normalize: true
