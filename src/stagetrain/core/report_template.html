<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ · stagetrain report</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11, 11, 11, 0.10);
  --series-1: #2a78d6; --series-2: #eb6834;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255, 255, 255, 0.10);
    --series-1: #3987e5; --series-2: #d95926;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 32px 24px 64px; background: var(--page); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
main { max-width: 1120px; margin: 0 auto; }
h1 { font-size: 22px; font-weight: 600; margin: 0; }
h2 { font-size: 16px; font-weight: 600; margin: 40px 0 4px; }
h3 { font-size: 14px; font-weight: 600; margin: 24px 0 8px; }
.sub { color: var(--ink-2); margin: 2px 0 0; }
.kind { color: var(--muted); font-weight: 400; margin-left: 8px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 20px; }
.tile .label { color: var(--ink-2); font-size: 12px; }
.tile .value { font-size: 26px; font-weight: 600; line-height: 1.2; margin-top: 2px; }
.tile .note { color: var(--ink-2); font-size: 12px; margin-top: 2px; }

.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th { text-align: left; color: var(--ink-2); font-weight: 500; font-size: 12px; padding: 6px 12px 6px 0; border-bottom: 1px solid var(--axis); white-space: nowrap; }
td { padding: 8px 12px 8px 0; border-bottom: 1px solid var(--grid); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.state { white-space: nowrap; }
.icon { display: inline-block; width: 1.2em; font-weight: 700; }
.icon.good { color: var(--good); } .icon.warning { color: var(--warning); }
.icon.serious { color: var(--serious); } .icon.critical { color: var(--critical); } .icon.none { color: var(--muted); }
.gate { display: block; }
.metric { display: inline-block; margin: 0 12px 2px 0; white-space: nowrap; }
.metric b { font-weight: 600; font-variant-numeric: tabular-nums; }
.metric span { color: var(--ink-2); }
.reason { color: var(--ink-2); font-size: 12px; display: block; max-width: 44ch; }
.variant { color: var(--ink-2); font-size: 12px; white-space: nowrap; }

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 12px; }
figure { margin: 0; position: relative; }
figcaption { font-weight: 600; margin-bottom: 2px; overflow-wrap: anywhere; }
.caption-note { color: var(--ink-2); font-size: 12px; margin-bottom: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
.legend .key, .tip .key { display: inline-block; width: 14px; height: 2px; border-radius: 1px; vertical-align: middle; margin-right: 6px; }
.legend b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; margin-left: 6px; }
svg.plot { display: block; width: 100%; height: auto; outline: none; }
svg.plot:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; border-radius: 4px; }
svg.plot text { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); font-variant-numeric: tabular-nums; }
svg.plot text.value { fill: var(--ink); font-weight: 600; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.tip {
  position: absolute; pointer-events: none; z-index: 2; min-width: 120px; padding: 8px 10px; border-radius: 6px;
  background: var(--surface); border: 1px solid var(--border); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.14);
  font-size: 12px; white-space: nowrap;
}
.tip .head { color: var(--ink-2); margin-bottom: 4px; }
.tip .row b { font-weight: 600; font-variant-numeric: tabular-nums; margin-right: 6px; }
.tip .row span { color: var(--ink-2); }

.bars { display: grid; grid-template-columns: minmax(72px, max-content) 1fr; column-gap: 12px; row-gap: 8px; align-items: center; }
.bars .name { color: var(--ink-2); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }
.bars .track { position: relative; height: 20px; border-left: 1px solid var(--axis); outline: none; }
.bars .track:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
.bars .bar { position: absolute; top: 2px; height: 16px; background: var(--series-1); border-radius: 0 4px 4px 0; }
.bars .bar.negative { border-radius: 4px 0 0 4px; }
.bars .track:hover .bar, .bars .track:focus-visible .bar { filter: brightness(1.15); }
.bars .tipvalue { position: absolute; top: 0; line-height: 20px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 6px; }
.bars .tipvalue span { color: var(--ink-2); font-weight: 400; margin-left: 6px; }

details { margin-top: 8px; font-size: 12px; }
summary { color: var(--ink-2); cursor: pointer; width: max-content; }
details table { margin-top: 6px; width: auto; }
details td, details th { padding: 3px 16px 3px 0; }
details .scroll { max-height: 260px; overflow: auto; }
.empty { color: var(--ink-2); }
</style>
</head>
<body>
<main id="app"></main>
<script id="data" type="application/json">__DATA__</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("data").textContent);
const SVG = "http://www.w3.org/2000/svg";

// Everything shown comes from run files; it is only ever inserted as text.
function h(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") node.className = v; else node.setAttribute(k, v);
  }
  for (const child of children) {
    if (child == null) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}
function s(tag, attrs) {
  const node = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
  return node;
}
function fmt(v) {
  if (v == null || !Number.isFinite(v)) return "–";
  const a = Math.abs(v);
  if (a === 0) return "0";
  if (a >= 1e6 || a < 1e-3) return v.toExponential(2).replace("e+", "e");
  if (a >= 1000) return Math.round(v).toLocaleString("en-US");
  return String(+v.toPrecision(4));
}
function fmtDuration(sec) {
  if (sec == null) return "–";
  if (sec < 60) return `${+sec.toFixed(1)} s`;
  if (sec < 3600) return `${Math.floor(sec / 60)} min ${Math.round(sec % 60)} s`;
  return `${Math.floor(sec / 3600)} h ${Math.round((sec % 3600) / 60)} min`;
}
function niceTicks(lo, hi, count) {
  if (lo === hi) { const pad = Math.abs(lo) * 0.1 || 1; lo -= pad; hi += pad; }
  const raw = (hi - lo) / Math.max(count, 1);
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((m) => m >= raw) || raw;
  const ticks = [];
  for (let t = Math.floor(lo / step) * step; t <= hi + step * 1e-9; t += step) ticks.push(+t.toPrecision(12));
  if (ticks[ticks.length - 1] < hi) ticks.push(+(ticks[ticks.length - 1] + step).toPrecision(12));
  return ticks;
}

const STATES = {
  cached: ["✓", "good", "finished"],
  gate_failed: ["✕", "critical", "gate failed"],
  failed: ["✕", "critical", "failed"],
  stale: ["↻", "warning", "stale"],
  interrupted: ["!", "serious", "interrupted or running"],
  pending: ["○", "none", "pending"],
};
function stateCell(state) {
  const [icon, tone, label] = STATES[state] || ["?", "none", state];
  return h("span", { class: "state" }, h("span", { class: `icon ${tone}`, "aria-hidden": "true" }, icon), label);
}

function dataTable(columns, rows) {
  const limit = 200;
  const stride = Math.ceil(rows.length / limit);
  const shown = stride > 1 ? rows.filter((_, i) => i % stride === 0 || i === rows.length - 1) : rows;
  const table = h("table", {}, h("thead", {}, h("tr", {}, ...columns.map((c, i) => h("th", i ? { class: "num" } : {}, c)))));
  const body = h("tbody");
  for (const row of shown) body.append(h("tr", {}, ...row.map((c, i) => h("td", i ? { class: "num" } : {}, c))));
  table.append(body);
  const label = stride > 1 ? `Data table (every ${stride}th of ${rows.length} rows)` : "Data table";
  return h("details", {}, h("summary", {}, label), h("div", { class: "scroll" }, table));
}

function nearest(points, x) {
  let lo = 0, hi = points.length - 1;
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (points[mid][0] < x) lo = mid; else hi = mid; }
  return Math.abs(points[lo][0] - x) <= Math.abs(points[hi][0] - x) ? lo : hi;
}

function lineChart(chart) {
  const W = 520, H = 236, m = { l: 54, r: 20, t: 14, b: 30 };
  const series = chart.series.filter((x) => x.points.length);
  const figure = h("figure", { class: "card" }, h("figcaption", {}, chart.title));
  if (!series.length) { figure.append(h("div", { class: "empty" }, "No points yet.")); return figure; }

  const last = (x) => x.points[x.points.length - 1];
  if (series.length > 1) {
    const legend = h("div", { class: "legend" });
    series.forEach((x, i) => legend.append(h("span", {},
      h("span", { class: "key", style: `background: var(--series-${i + 1})` }), x.name, h("b", {}, fmt(last(x)[1])))));
    figure.append(legend);
  }

  const xs = series.flatMap((x) => x.points.map((p) => p[0]));
  const ys = series.flatMap((x) => x.points.map((p) => p[1]));
  let x0 = Math.min(...xs), x1 = Math.max(...xs);
  if (x0 === x1) { x0 -= 1; x1 += 1; }
  const yTicks = niceTicks(Math.min(...ys), Math.max(...ys), 4);
  const y0 = yTicks[0], y1 = yTicks[yTicks.length - 1];
  const px = (x) => m.l + ((x - x0) / (x1 - x0)) * (W - m.l - m.r);
  const py = (y) => H - m.b - ((y - y0) / (y1 - y0)) * (H - m.t - m.b);

  const names = series.map((x) => `${x.name} ${fmt(last(x)[1])}`).join(", ");
  const svg = s("svg", { class: "plot", viewBox: `0 0 ${W} ${H}`, role: "img", tabindex: "0",
    "aria-label": `${chart.title} by ${chart.x}. Last values: ${names}. Use the arrow keys to read values.` });
  for (const t of yTicks) {
    svg.append(s("line", { x1: m.l, x2: W - m.r, y1: py(t), y2: py(t), stroke: t === y0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
    const label = s("text", { x: m.l - 8, y: py(t) + 4, "text-anchor": "end" });
    label.textContent = fmt(t);
    svg.append(label);
  }
  for (const t of niceTicks(x0, x1, 4).filter((t) => t >= x0 && t <= x1)) {
    const label = s("text", { x: px(t), y: H - m.b + 16, "text-anchor": "middle" });
    label.textContent = fmt(t);
    svg.append(label);
  }
  const axisLabel = s("text", { x: W - m.r, y: H - 2, "text-anchor": "end" });
  axisLabel.textContent = chart.x;
  svg.append(axisLabel);

  series.forEach((x, i) => {
    const color = `var(--series-${i + 1})`;
    const d = x.points.map((p, k) => `${k ? "L" : "M"}${px(p[0]).toFixed(1)},${py(p[1]).toFixed(1)}`).join("");
    svg.append(s("path", { d, fill: "none", stroke: color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    // Sparse series (evaluations) show every point; dense ones only their end.
    const marked = x.points.length <= 24 ? x.points : [last(x)];
    for (const p of marked) svg.append(s("circle", { cx: px(p[0]), cy: py(p[1]), r: 4, fill: color, stroke: "var(--surface)", "stroke-width": 2 }));
  });
  if (series.length === 1) {
    const p = last(series[0]);
    const y = py(p[1]) - 10 < m.t + 8 ? py(p[1]) + 18 : py(p[1]) - 10;
    const label = s("text", { class: "value", x: Math.min(px(p[0]), W - m.r), y, "text-anchor": "end" });
    label.textContent = fmt(p[1]);
    svg.append(label);
  }

  // Hover layer: a crosshair that snaps to the nearest logged step, one tooltip for every series.
  const cross = s("line", { y1: m.t, y2: H - m.b, stroke: "var(--axis)", "stroke-width": 1, visibility: "hidden" });
  const dots = series.map((_, i) => s("circle", { r: 5, fill: `var(--series-${i + 1})`, stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" }));
  svg.append(cross, ...dots);
  const tip = h("div", { class: "tip", hidden: "" });
  const steps = [...new Set(xs)].sort((a, b) => a - b);
  let cursor = steps.length - 1;
  function show(step) {
    cross.setAttribute("x1", px(step)); cross.setAttribute("x2", px(step)); cross.setAttribute("visibility", "visible");
    tip.replaceChildren(h("div", { class: "head" }, `${chart.x} ${fmt(step)}`));
    series.forEach((x, i) => {
      const p = x.points[nearest(x.points, step)];
      dots[i].setAttribute("cx", px(p[0])); dots[i].setAttribute("cy", py(p[1])); dots[i].setAttribute("visibility", "visible");
      const at = p[0] === step ? "" : ` (at ${fmt(p[0])})`;
      tip.append(h("div", { class: "row" }, h("span", { class: "key", style: `background: var(--series-${i + 1})` }),
        h("b", {}, fmt(p[1])), h("span", {}, x.name + at)));
    });
    tip.hidden = false;
    const box = svg.getBoundingClientRect(), host = figure.getBoundingClientRect();
    const left = box.left - host.left + (px(step) / W) * box.width;
    const flip = left + tip.offsetWidth + 16 > host.width;
    tip.style.left = `${flip ? left - tip.offsetWidth - 12 : left + 12}px`;
    tip.style.top = `${box.top - host.top + 8}px`;
  }
  function hide() { tip.hidden = true; cross.setAttribute("visibility", "hidden"); dots.forEach((d) => d.setAttribute("visibility", "hidden")); }
  svg.addEventListener("pointermove", (e) => {
    const box = svg.getBoundingClientRect();
    const x = x0 + (((e.clientX - box.left) / box.width) * W - m.l) / (W - m.l - m.r) * (x1 - x0);
    cursor = nearest(steps.map((v) => [v]), Math.min(Math.max(x, x0), x1));
    show(steps[cursor]);
  });
  svg.addEventListener("pointerleave", hide);
  svg.addEventListener("focus", () => show(steps[cursor]));
  svg.addEventListener("blur", hide);
  svg.addEventListener("keydown", (e) => {
    const move = { ArrowLeft: -1, ArrowRight: 1, Home: -steps.length, End: steps.length }[e.key];
    if (!move) return;
    e.preventDefault();
    cursor = Math.min(Math.max(cursor + move, 0), steps.length - 1);
    show(steps[cursor]);
  });

  const index = series.map((x) => new Map(x.points));
  const rows = steps.map((step) => [fmt(step), ...index.map((map) => (map.has(step) ? fmt(map.get(step)) : ""))]);
  figure.append(svg, tip, dataTable([chart.x, ...series.map((x) => x.name)], rows));
  return figure;
}

function barChart(cmp) {
  const values = cmp.rows.map((r) => r.value);
  const lo = Math.min(0, ...values), hi = Math.max(0, ...values);
  const span = hi - lo || 1;
  const best = cmp.lower_is_better ? Math.min(...values) : Math.max(...values);
  const tied = values.filter((v) => v === best).length > 1;  // a tie has no best stage to point at
  const figure = h("figure", { class: "card" }, h("figcaption", {}, cmp.metric),
    h("div", { class: "caption-note" }, `${cmp.lower_is_better ? "lower" : "higher"} is better · stages in pipeline order`));
  const bars = h("div", { class: "bars" });
  const tip = h("div", { class: "tip", hidden: "" });
  for (const row of cmp.rows) {
    const from = (Math.min(row.value, 0) - lo) / span, width = Math.abs(row.value) / span;
    // The value sits at the bar's tip; 78% of the track is the longest bar, so the text always fits.
    const track = h("div", { class: "track", tabindex: "0", role: "img", "aria-label": `${row.stage}: ${cmp.metric} ${fmt(row.value)}` });
    const bar = h("div", { class: row.value < 0 ? "bar negative" : "bar", style: `left: ${from * 78}%; width: ${Math.max(width * 78, 0.3)}%` });
    const value = h("div", { class: "tipvalue", style: `left: ${(from + width) * 78}%` }, fmt(row.value));
    if (row.value === best && !tied) value.append(h("span", {}, "best"));
    track.append(bar, value);
    const show = () => {
      tip.replaceChildren(h("div", { class: "head" }, row.stage), h("div", { class: "row" }, h("b", {}, fmt(row.value)), h("span", {}, cmp.metric)));
      tip.hidden = false;
      const box = track.getBoundingClientRect(), host = figure.getBoundingClientRect();
      tip.style.left = `${Math.min(box.left - host.left + 8, host.width - tip.offsetWidth - 8)}px`;
      tip.style.top = `${box.bottom - host.top + 4}px`;
    };
    const hide = () => { tip.hidden = true; };
    track.addEventListener("pointerenter", show); track.addEventListener("pointerleave", hide);
    track.addEventListener("focus", show); track.addEventListener("blur", hide);
    bars.append(h("div", { class: "name", title: row.stage }, row.stage), track);
  }
  figure.append(bars, tip, dataTable(["stage", cmp.metric], cmp.rows.map((r) => [r.stage, fmt(r.value)])));
  return figure;
}

function tile(label, value, note) {
  return h("div", { class: "card tile" }, h("div", { class: "label" }, label), h("div", { class: "value" }, value),
    note ? h("div", { class: "note" }, note) : null);
}

function render() {
  const app = document.getElementById("app");
  const sum = DATA.summary;
  app.append(h("h1", {}, `${DATA.track} / ${DATA.name}`),
    h("p", { class: "sub" }, `${DATA.run_dir} · generated ${DATA.generated_at.replace("T", " ").replace("+00:00", " UTC")}`));
  const gates = sum.gates_passed + sum.gates_failed;
  app.append(h("div", { class: "tiles" },
    tile("Stages finished", `${sum.finished} / ${sum.stages}`),
    tile("Time in finished stages", fmtDuration(sum.duration_s)),
    tile("Gates passed", gates ? `${sum.gates_passed} / ${gates}` : "–", gates ? (sum.gates_failed ? `${sum.gates_failed} failed` : "none failed") : "no gates set")));

  app.append(h("h2", {}, "Stages"));
  const body = h("tbody");
  for (const st of DATA.stages) {
    const gateCell = h("td");
    for (const g of st.gates) gateCell.append(h("span", { class: "gate" },
      h("span", { class: `icon ${g.passed ? "good" : "critical"}`, "aria-hidden": "true" }, g.passed ? "✓" : "✕"), g.detail));
    const metricCell = h("td");
    const entries = Object.entries(st.metrics);
    const lead = entries.filter(([k]) => k.startsWith("eval/")).concat(entries.filter(([k]) => !k.startsWith("eval/"))).slice(0, 6);
    for (const [k, v] of lead) metricCell.append(h("span", { class: "metric" }, h("b", {}, fmt(v)), " ", h("span", {}, k)));
    if (entries.length > lead.length) metricCell.append(dataTable(["metric", "value"], entries.map(([k, v]) => [k, fmt(v)])));
    body.append(h("tr", {},
      h("td", {}, h("b", {}, st.name), h("div", { class: "reason" }, st.kind),
        Object.keys(st.variant).length ? h("div", { class: "variant" }, Object.entries(st.variant).map(([k, v]) => `${k.split(".").pop()}=${fmt(v) === "–" ? v : fmt(v)}`).join(" · ")) : null),
      h("td", {}, stateCell(st.state), st.reason ? h("span", { class: "reason" }, st.reason) : null),
      h("td", { class: "num" }, fmtDuration(st.duration_s)), gateCell, metricCell));
  }
  app.append(h("div", { class: "card scroll" }, h("table", {},
    h("thead", {}, h("tr", {}, h("th", {}, "Stage"), h("th", {}, "State"), h("th", { class: "num" }, "Time"), h("th", {}, "Gates"), h("th", {}, "Metrics"))), body)));

  app.append(h("h2", {}, "Evaluation across stages"),
    h("p", { class: "sub" }, "Each eval metric that at least two finished stages report, stage by stage."));
  if (DATA.comparisons.length) app.append(h("div", { class: "grid", style: "margin-top: 12px" }, ...DATA.comparisons.map(barChart)));
  else app.append(h("p", { class: "empty" }, "No eval metric is reported by two finished stages yet."));

  app.append(h("h2", {}, "Training curves"),
    h("p", { class: "sub" }, "What each training stage logged. Hover a chart, or focus it and use the arrow keys, to read values."));
  const trained = DATA.stages.filter((st) => st.charts.length);
  if (!trained.length) app.append(h("p", { class: "empty" }, "No stage has logged training history yet."));
  for (const st of trained) {
    app.append(h("h3", {}, st.name, h("span", { class: "kind" }, st.kind)), h("div", { class: "grid" }, ...st.charts.map(lineChart)));
  }
}
render();
</script>
</body>
</html>
